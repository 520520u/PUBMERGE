name: PubMerge
options:
  bundleIdPrefix: app.pubmerge
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: es
packages:
  PubMergeCore:
    path: Packages/PubMergeCore
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PubMerge
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PubMerge:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pubmerge.PubMerge
        PRODUCT_NAME: PubMerge
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PubMerge.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: App/Info.plist
    dependencies:
      - package: PubMergeCore
    scheme:
      testTargets:
        - PubMergeCoreTests
  PubMergeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/PubMergeCore/Tests/PubMergeCoreTests
    dependencies:
      - package: PubMergeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pubmerge.PubMergeTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"
schemes:
  PubMerge:
    build:
      targets:
        PubMerge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PubMergeCoreTests
